bio: |
  I study strongly interacting matter under extreme conditions using
  high-energy nuclear collisions. Quantum chromodynamics predicts that, at
  sufficiently high temperature and energy density, quarks and gluons can
  form a quark–gluon plasma — a state of matter similar to what filled the
  early Universe shortly after the Big Bang. My work asks how this medium
  forms and evolves, what changes as we move from large heavy-ion
  collisions to light-ion and smaller collision systems, and how we can
  distinguish hot-medium effects from modifications already present in
  cold nuclei. I use computational modeling, hydrodynamic backgrounds, and
  quantum and semiclassical transport to connect QCD theory with
  measurements at RHIC and the LHC. Alongside this work, I explore quantum
  computing and AI/scientific machine learning for problems in fundamental
  physics and beyond.

