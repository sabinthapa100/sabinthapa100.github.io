# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.
#
# Dropdowns: a child entry sets `parent: <top-level name>` to nest under it.
# Hugo's native menu system (`.HasChildren`/`.Children`) plus this theme's
# `headers/navbar.html` render these as a real dropdown (desktop hover,
# mobile tap, keyboard accessible) automatically — nothing else to wire up.
# One dropdown level only; do not nest a `parent:` under another child.

