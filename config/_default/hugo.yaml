# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://sabinthapa100.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

cascade:
  - _target:
      path: /slides/**
      kind: page
    outputs: [HTML, present]
  # Type badges on card views (e.g. the homepage's mixed "Recent Updates"
  # collection) — the card partial already supports a `content_meta.
  # content_type` label, this just fills it in per section instead of
  # requiring it on every page. A page that sets its own `content_meta`
  # (e.g. `trending`) must include `content_type` itself too, since Hugo
  # cascade doesn't deep-merge into a param a page already defines.
  - _target:
      path: /notes/**
      kind: page
    params:
      content_meta:
        content_type: "Note"
  - _target:
      path: /journey/**
      kind: page
    params:
      content_meta:
        content_type: "Journey"
  - _target:
      path: /events/**
      kind: page
    params:
      content_meta:
        content_type: "Event"
  - _target:
      path: /publications/**
      kind: page
    params:
      content_meta:
        content_type: "Publication"
  - _target:
      path: /projects/**
      kind: page
    params:
      content_meta:
        content_type: "Project"

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
# Native Hugo alias redirect stubs (static HTML + meta refresh) are needed
# because this site deploys to GitHub Pages, which does not honor the
# Netlify-style `_redirects` file produced by the `redirects` output format
# below — that file alone would leave old URLs (e.g. /academia/) 404ing.
disableAliases: false
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
  era: eras
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep
# Privacy-enhanced YouTube embeds (youtube-nocookie.com) for the built-in
# `{{< youtube ID >}}` shortcode — see docs/CONTENT-GUIDE.md.
privacy:
  youtube:
    privacyEnhanced: true
